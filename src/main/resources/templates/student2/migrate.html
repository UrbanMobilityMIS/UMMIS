<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Migrate to MongoDB</title>
</head>
<body>
<section>
    <h1 style="color:#1a3cff; font-size:2rem; font-weight:700; margin-bottom:0.5rem;">
        Migrate to MongoDB
    </h1>
    <p style="color:#6b7280; margin-bottom:2rem;">
        Copies all rental records from MariaDB into the MongoDB
        <code>rentals</code> collection.
    </p>

    <!-- Success message -->
    <div th:if="${success}"
         style="background:#d1fae5; border:1px solid #6ee7b7;
                padding:1rem; border-radius:8px; margin-bottom:1.5rem; color:#065f46;">
        ✅ <span th:text="${success}"></span>
    </div>

    <!-- Error message -->
    <div th:if="${error}"
         style="background:#fee2e2; border:1px solid #fca5a5;
                padding:1rem; border-radius:8px; margin-bottom:1.5rem; color:#991b1b;">
        ❌ <span th:text="${error}"></span>
    </div>

    <!-- Migration button -->
    <form method="post" action="/student2/migrate">
        <button type="submit"
                style="background:#1a3cff; color:white; padding:0.75rem 2rem;
                       border:none; border-radius:8px; font-size:1rem;
                       cursor:pointer; font-weight:600;">
            Run Migration
        </button>
    </form>

    <!-- What gets migrated -->
    <div style="margin-top:2rem; background:white; border-radius:12px;
                padding:1.5rem; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
        <h3 style="margin-bottom:1rem;">What gets migrated</h3>
        <table style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="background:#f3f4f6;">
                    <th style="padding:0.75rem; text-align:left;">
                        MariaDB Table
                    </th>
                    <th style="padding:0.75rem; text-align:left;">
                        MongoDB Collection
                    </th>
                    <th style="padding:0.75rem; text-align:left;">
                        Fields Included
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr style="border-top:1px solid #e5e7eb;">
                    <td style="padding:0.75rem;">rental</td>
                    <td style="padding:0.75rem;">rentals</td>
                    <td style="padding:0.75rem;">
                        rentalId, userId, userEmail,
                        vehicleId, vehicleModel, startTime
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
