<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout(~{::title}, ~{::main-content})}">

<head>
    <title>Student 3 Use Case</title>
</head>

<body>
    <th:block th:fragment="main-content">

        <div class="max-w-4xl mx-auto py-10 text-slate-100">

            <div class="mb-8">
                <p class="text-sm text-slate-400 mb-1">Student 3 · Use Case</p>
                <h1 class="text-3xl font-bold text-slate-100">
                    Onboard New Level 2 Technician and Record Initial Maintenance Task
                </h1>
                <p class="text-slate-400 mt-2">
                    Create a technician, an employee record, and the first maintenance log in a single workflow.
                </p>
            </div>

            <div th:if="${success}"
                class="mb-6 rounded-2xl border border-green-900/40 bg-[#10261c] text-green-100 px-4 py-3">
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/student3/usecase}" th:object="${dto}" method="post"
                class="bg-[#101c38] rounded-2xl shadow-2xl border border-[#223055] p-8 space-y-8">

                <!-- Employee Section -->
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-slate-100">Employee Information</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">
                                Employee Name
                            </label>
                            <input type="text" th:field="*{employeeName}" required
                                class="w-full rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887]" />
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">
                                Hire Date
                            </label>
                            <input type="date" th:field="*{hireDate}" required
                                class="w-full rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887]"
                                style="color-scheme: dark;" />
                        </div>
                    </div>
                </div>

                <!-- Technician Section -->
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-slate-100">Technician Information</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">
                                Toolkit ID
                            </label>
                            <input type="text" th:field="*{toolkitId}" required
                                class="w-full rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887]" />
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">
                                Certification Level
                            </label>
                            <input type="text" value="Level 2" disabled
                                class="w-full rounded-xl border border-[#2c3c63] bg-[#13264e] px-4 py-3 text-sm text-slate-300 cursor-not-allowed" />
                        </div>
                    </div>
                </div>

                <!-- Maintenance Section -->
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-slate-100">Initial Maintenance Task</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">
                                Vehicle
                            </label>
                            <div class="relative">
                                <select th:field="*{vehicleId}" required
                                    class="w-full appearance-none rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 pr-10 text-sm text-slate-100 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887] cursor-pointer">
                                    <option value="">Select Vehicle</option>
                                    <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}"
                                        th:text="${vehicle.vin + ' - ' + vehicle.modelType}">
                                    </option>
                                </select>
                                <span
                                    class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-400">▾</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">
                                Repair Date
                            </label>
                            <input type="date" th:field="*{repairDate}" required
                                class="w-full rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887]"
                                style="color-scheme: dark;" />
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">
                                Service Cost
                            </label>
                            <input type="number" step="0.01" th:field="*{serviceCost}" required
                                class="w-full rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887]" />
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-xl font-semibold transition-colors shadow-lg shadow-blue-950/30">
                        Onboard Technician
                    </button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <a th:href="@{/student3/analytics}" class="text-primary-light text-sm hover:underline">
                    View Technician Performance Analytics →
                </a>
            </div>
        </div>

    </th:block>
</body>

</html>
