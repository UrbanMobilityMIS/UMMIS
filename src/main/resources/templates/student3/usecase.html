<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::main-content})}">
<head>
    <title>Student 3 Use Case</title>
</head>

<body>

<th:block th:fragment="main-content">

    <div class="max-w-4xl mx-auto py-10">

        <div class="mb-8">
            <h1 class="text-3xl font-bold">
                Student 3 — Use Case
            </h1>

            <p class="text-slate-500 mt-2">
                Onboard New Level 2 Technician and Record Initial Maintenance Task
            </p>
        </div>

        <div th:if="${success}"
             class="mb-6 rounded-xl border border-green-300 bg-green-100 text-green-800 px-4 py-3">
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/student3/usecase}"
              th:object="${dto}"
              method="post"
              class="bg-white rounded-2xl shadow border p-8 space-y-8">

            <!-- Employee Section -->
            <div>
                <h2 class="text-xl font-semibold mb-4">
                    Employee Information
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Employee Name
                        </label>

                        <input type="text"
                               th:field="*{employeeName}"
                               required
                               class="w-full border rounded-lg px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Hire Date
                        </label>

                        <input type="date"
                               th:field="*{hireDate}"
                               required
                               class="w-full border rounded-lg px-3 py-2">
                    </div>

                </div>
            </div>

            <!-- Technician Section -->
            <div>
                <h2 class="text-xl font-semibold mb-4">
                    Technician Information
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Toolkit ID
                        </label>

                        <input type="text"
                               th:field="*{toolkitId}"
                               required
                               class="w-full border rounded-lg px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Certification Level
                        </label>

                        <input type="text"
                               value="Level 2"
                               disabled
                               class="w-full border rounded-lg px-3 py-2 bg-slate-100">
                    </div>

                </div>
            </div>

            <!-- Maintenance Section -->
            <div>
                <h2 class="text-xl font-semibold mb-4">
                    Initial Maintenance Task
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Vehicle
                        </label>

                        <select th:field="*{vehicleId}"
                                required
                                class="w-full border rounded-lg px-3 py-2">

                            <option value="">
                                Select Vehicle
                            </option>

                            <option th:each="vehicle : ${vehicles}"
                                    th:value="${vehicle.id}"
                                    th:text="${vehicle.vin + ' - ' + vehicle.modelType}">
                            </option>

                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Repair Date
                        </label>

                        <input type="date"
                               th:field="*{repairDate}"
                               required
                               class="w-full border rounded-lg px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Service Cost
                        </label>

                        <input type="number"
                               step="0.01"
                               th:field="*{serviceCost}"
                               required
                               class="w-full border rounded-lg px-3 py-2">
                    </div>

                </div>
            </div>

            <div class="pt-4">
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium">
                    Onboard Technician
                </button>
            </div>

        </form>
        <div class="mt-4 text-center">
                <a th:href="@{/student3/analytics}" class="text-primary text-sm hover:underline">
                    View Technician Performance Analytics →
                </a>
            </div>
    </div>

</th:block>

</body>
</html>
