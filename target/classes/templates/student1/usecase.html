<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout(~{::title}, ~{::main-content})}">

<head>
    <title>Report Vehicle Damage – Student 1</title>
</head>

<body>
    <th:block th:fragment="main-content">

        <div class="max-w-2xl mx-auto">
            <p class="text-xs text-slate-400 mb-2">
                Vehicles: <span th:text="${#lists.size(vehicles)}"></span>,
                Technicians: <span th:text="${#lists.size(technicians)}"></span>
            </p>

            <div class="mb-6">
                <p class="text-sm text-slate-400 mb-1">Student 1 · Use Case</p>
                <h1 class="text-2xl font-bold text-slate-100">Report Vehicle Damage</h1>
                <p class="text-slate-400 mt-1 text-sm">
                    Creates a new <code
                        class="bg-[#101c38] px-1.5 py-0.5 rounded font-mono text-xs text-slate-200">Maintenance_Log</code>
                    record linked to a Vehicle and Technician. Demonstrates the <strong>Weak Entity</strong>
                    relationship.
                </p>
            </div>

            <div th:if="${success}"
                class="mb-4 p-4 bg-[#10261c] border border-green-900/40 rounded-2xl text-green-100 text-sm">
                ✅ <span th:text="${success}"></span>
                — <a th:href="@{/student1/analytics}" class="underline font-medium text-green-300">View analytics to see
                    the change →</a>
            </div>
            <div th:if="${error}"
                class="mb-4 p-4 bg-[#2a1517] border border-red-900/40 rounded-2xl text-red-100 text-sm">
                ❌ <span th:text="${error}"></span>
            </div>

            <div class="bg-[#101c38] rounded-2xl shadow-2xl p-6 border border-[#223055]">
                <form th:action="@{/student1/usecase}" th:object="${form}" method="post" class="space-y-5">

                    <div>
                        <label for="vehicleId" class="block text-sm font-medium text-slate-300 mb-1">Vehicle</label>
                        <div class="relative">
                            <select th:field="*{vehicleId}" id="vehicleId"
                                class="w-full appearance-none rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 pr-10 text-sm text-slate-100 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887] cursor-pointer">
                                <option value="">— Select a vehicle —</option>
                                <option th:each="v : ${vehicles}" th:value="${v.id}"
                                    th:text="${v.id + ' · ' + v.vin + ' (' + v.modelType + ')'}"></option>
                            </select>
                            <span
                                class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-400">▾</span>
                        </div>
                        <p th:if="${#fields.hasErrors('vehicleId')}" th:errors="*{vehicleId}"
                            class="mt-1 text-xs text-red-300"></p>
                    </div>

                    <div>
                        <label for="technicianId"
                            class="block text-sm font-medium text-slate-300 mb-1">Technician</label>
                        <div class="relative">
                            <select th:field="*{technicianId}" id="technicianId"
                                class="w-full appearance-none rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 pr-10 text-sm text-slate-100 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887] cursor-pointer">
                                <option value="">— Select a technician —</option>
                                <option th:each="t : ${technicians}" th:value="${t.employeeId}"
                                    th:text="${t.employeeId + ' · ' + t.employee.name + ' (' + t.certificationLevel + ')'}">
                                </option>
                            </select>
                            <span
                                class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-400">▾</span>
                        </div>
                        <p th:if="${#fields.hasErrors('technicianId')}" th:errors="*{technicianId}"
                            class="mt-1 text-xs text-red-300"></p>
                    </div>

                    <div>
                        <label for="repairDate" class="block text-sm font-medium text-slate-300 mb-1">Repair
                            Date</label>
                        <input th:field="*{repairDate}" id="repairDate" type="date"
                            class="w-full rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 text-sm text-slate-100 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887]"
                            style="color-scheme: dark;" />
                        <p th:if="${#fields.hasErrors('repairDate')}" th:errors="*{repairDate}"
                            class="mt-1 text-xs text-red-300"></p>
                    </div>

                    <div>
                        <label for="serviceCost" class="block text-sm font-medium text-slate-300 mb-1">Service Cost
                            (€)</label>
                        <input th:field="*{serviceCost}" id="serviceCost" type="number" step="0.01" min="0"
                            placeholder="e.g. 150.00"
                            class="w-full rounded-xl border border-[#2c3c63] bg-[#0b1733] px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-400/25 hover:border-[#425887]" />
                        <p th:if="${#fields.hasErrors('serviceCost')}" th:errors="*{serviceCost}"
                            class="mt-1 text-xs text-red-300"></p>
                    </div>

                    <button type="submit"
                        class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3 rounded-xl transition-colors shadow-lg shadow-blue-950/30">
                        Submit Damage Report
                    </button>
                </form>
            </div>

            <div class="mt-4 text-center">
                <a th:href="@{/student1/analytics}" class="text-primary-light text-sm hover:underline">
                    View Maintenance Cost Analytics →
                </a>
            </div>
        </div>

    </th:block>
</body>

</html>
