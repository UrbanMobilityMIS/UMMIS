<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Migrate to MongoDB</title>
</head>
<body>
<section>
    <h1 style="color:#1a3cff; font-size:2rem; font-weight:700; margin-bottom:0.5rem;">
        Migrate to MongoDB
    </h1>
    <p style="color:#6b7280; margin-bottom:2rem;">
        Migrates data from MariaDB tables into MongoDB collections.
        <code>rentals</code> collection.
    </p>

    <!-- Success message -->
    <div th:if="${success}"
         style="background:#d1fae5; border:1px solid #6ee7b7;
                padding:1rem; border-radius:8px; margin-bottom:1.5rem; color:#065f46;">
         <span th:text="${success}"></span>
    </div>

    <!-- Error message -->
    <div th:if="${error}"
         style="background:#fee2e2; border:1px solid #fca5a5;
                padding:1rem; border-radius:8px; margin-bottom:1.5rem; color:#991b1b;">
         <span th:text="${error}"></span>
    </div>

    <!-- Migration button -->
    <form method="post" action="/student2/migrate">
        <button type="submit"
                style="background:#1a3cff; color:white; padding:0.75rem 2rem;
                       border:none; border-radius:8px; font-size:1rem;
                       cursor:pointer; font-weight:600;">
            Run Migration
        </button>
    </form>
    <div class="bg-white rounded-xl shadow p-6 mt-8"
     th:if="${mongoRentals != null and !#lists.isEmpty(mongoRentals)}">
</div>
</section>
</body>
</html>
